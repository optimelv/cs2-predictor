services:
  worker:
    build:
      context: ../..
      dockerfile: infra/oracle/worker/Dockerfile
    restart: unless-stopped
    environment:
      FETCH_BACKEND: scrapling-http
      ARCHIVE_BEARER_TOKEN: ${ARCHIVE_BEARER_TOKEN:-}
      HLTV_MATCHES_URL: https://www.hltv.org/matches
      POLL_SECONDS: "300"
      REQUEST_TIMEOUT_SECONDS: "90"
      SNAPSHOT_PATH: /data/last-good-snapshot.json
    volumes:
      - worker_data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - worker
    command: ["caddy", "reverse-proxy", "--from", "https://${WORKER_HOST}", "--to", "worker:8080"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  worker_data:
  caddy_data:
  caddy_config:
