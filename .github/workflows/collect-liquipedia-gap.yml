name: Collect Liquipedia gap evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "43 * * * *"

concurrency:
  group: strikesignal-data-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Import the Oracle collector's cached Liquipedia evidence
        run: |
          worker_url=$(node -e "import('./config/oracle-worker.js').then(({ORACLE_WORKER_URL}) => process.stdout.write(ORACLE_WORKER_URL || ''))")
          curl --fail --silent --show-error --connect-timeout 10 --max-time 45 \
            "$worker_url/liquipedia-evidence" --output "$RUNNER_TEMP/liquipedia-evidence.json"
          node scripts/import-liquipedia-evidence.mjs "$RUNNER_TEMP/liquipedia-evidence.json"
      - name: Add independently verified results to the historical desk
        run: node scripts/promote-liquipedia-history.mjs
      - name: Validate published data
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - name: Publish source evidence and team assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/liquipedia-gap-queue.json models/liquipedia-gap-state.json models/liquipedia-observed-results.jsonl docs/data/team-assets.json docs/data/team-assets.js docs/data/history.json
          git diff --cached --quiet || git commit -m "Collect Liquipedia match evidence and team assets"
          git pull --rebase
          git push
