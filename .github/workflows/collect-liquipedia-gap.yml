name: Collect Liquipedia gap evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "43 * * * *"

concurrency:
  group: collect-liquipedia-gap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check 'lxml>=5,<7'
      - name: Verify source mapping
        run: python -m unittest work.cs2_predictor.test_liquipedia_gap
      - name: Collect one official API batch
        run: python -m work.cs2_predictor.collect_liquipedia_gap
      - name: Add independently verified results to the historical desk
        run: node scripts/promote-liquipedia-history.mjs
      - name: Validate published data
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - name: Publish source evidence and team assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/liquipedia-gap-queue.json models/liquipedia-gap-state.json models/liquipedia-observed-results.jsonl docs/data/team-assets.json docs/data/team-assets.js docs/data/history.json
          git diff --cached --quiet || git commit -m "Collect Liquipedia match evidence and team assets"
          git pull --rebase
          git push
