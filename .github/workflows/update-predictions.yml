name: Refresh predictor data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: strikesignal-data-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Load private source and model data
        env:
          PRIVATE_DATA_DEPLOY_KEY: ${{ secrets.PRIVATE_DATA_DEPLOY_KEY }}
        run: bash scripts/private-data-sync.sh load

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install model runtime
        run: python -m pip install --disable-pip-version-check numpy scikit-learn lxml

      - name: Acquire a provider-neutral live snapshot
        id: snapshot
        shell: bash
        run: |
          snapshot_path="$RUNNER_TEMP/live-snapshot.json"
          worker_url=$(node -e "import('./config/oracle-worker.js').then(({ORACLE_WORKER_URL}) => process.stdout.write(ORACLE_WORKER_URL || ''))")
          if [ -n "$worker_url" ]; then
            echo "Trying the persistent Always Free worker."
            # Upstream health can degrade while a verified snapshot is still available.
            # The freshness gate below rejects expired or invalid cached snapshots.
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 5 \
              "$worker_url/snapshot" --output "$snapshot_path"; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "source=oracle" >> "$GITHUB_OUTPUT"
              echo "ephemeral=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Persistent snapshot unavailable; preserving the last verified release."
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "ephemeral=false" >> "$GITHUB_OUTPUT"

      - name: Validate freshness and source health
        if: steps.snapshot.outputs.available == 'true'
        run: |
          python - "$RUNNER_TEMP/live-snapshot.json" <<'PY'
          import json
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text())
          if not payload.get("ok") or not str(payload.get("contract_version", "")).startswith("1."):
              raise SystemExit("Live snapshot contract is invalid; refusing promotion.")
          if not payload.get("matches"):
              raise SystemExit("Live snapshot has no matches; refusing promotion.")
          fetched = datetime.fromisoformat(payload["fetched_at_utc"].replace("Z", "+00:00"))
          now = datetime.now(timezone.utc)
          if fetched > now + timedelta(minutes=5):
              raise SystemExit("Snapshot timestamp is in the future; refusing promotion.")
          age_hours = (now - fetched).total_seconds() / 3600
          if age_hours > 12:
              raise SystemExit(f"Snapshot is {age_hours:.1f} hours old; refusing fake freshness.")
          PY

      - name: Preserve all observed HLTV results, including lower tiers
        if: steps.snapshot.outputs.source == 'oracle'
        env:
          ORACLE_ARCHIVE_TOKEN: ${{ secrets.ORACLE_ARCHIVE_TOKEN }}
        run: |
          worker_url=$(node -e "import('./config/oracle-worker.js').then(({ORACLE_WORKER_URL}) => process.stdout.write(ORACLE_WORKER_URL || ''))")
          curl --fail --silent --show-error --connect-timeout 10 --max-time 45 \
            --header "Authorization: Bearer $ORACLE_ARCHIVE_TOKEN" \
            "$worker_url/archive" --output "$RUNNER_TEMP/observed-results.json"
          node scripts/ingest-observed-results.mjs "$RUNNER_TEMP/observed-results.json"

      - name: Retrieve cached server-side HLTV player profiles
        if: steps.snapshot.outputs.source == 'oracle'
        env:
          ORACLE_ARCHIVE_TOKEN: ${{ secrets.ORACLE_ARCHIVE_TOKEN }}
        run: |
          worker_url=$(node -e "import('./config/oracle-worker.js').then(({ORACLE_WORKER_URL}) => process.stdout.write(ORACLE_WORKER_URL || ''))")
          if ! curl --fail --silent --show-error --connect-timeout 10 --max-time 60 \
            --header "Authorization: Bearer $ORACLE_ARCHIVE_TOKEN" \
            "$worker_url/player-profiles" --output "$RUNNER_TEMP/player-profiles.json"; then
            echo "Player-profile cache was unavailable; preserving the last verified profile values."
            rm -f "$RUNNER_TEMP/player-profiles.json"
          fi

      - name: Enforce the Tier 1/2 product boundary
        if: steps.snapshot.outputs.available == 'true'
        run: |
          node scripts/filter-live-snapshot.mjs "$RUNNER_TEMP/live-snapshot.json"
          cp "$RUNNER_TEMP/live-snapshot.json" docs/data/live-snapshot.json

      - name: Backfill one overlap-checked HLTV results page
        if: steps.snapshot.outputs.source == 'github-actions'
        continue-on-error: true
        run: python -m work.cs2_predictor.backfill_runner_results

      - name: Refresh official Valve standings
        if: steps.snapshot.outputs.available == 'true'
        run: python -m work.cs2_predictor.refresh_rankings

      - name: Evaluate and safely promote the production model
        if: steps.snapshot.outputs.available == 'true'
        run: >
          python -m work.cs2_predictor.promote_portable_model
          --live-feed "$RUNNER_TEMP/live-snapshot.json"

      - name: Refresh predictions and online team state
        if: steps.snapshot.outputs.available == 'true'
        run: >
          python -m work.cs2_predictor.export_site_predictions
          --allow-missing-db
          --live-feed "$RUNNER_TEMP/live-snapshot.json"

      - name: Promote lineups and validate the release
        if: steps.snapshot.outputs.available == 'true'
        run: |
          npm ci --no-audit --no-fund
          if [ -s "$RUNNER_TEMP/player-profiles.json" ]; then
            node scripts/build-player-snapshot.mjs "$RUNNER_TEMP/player-profiles.json"
          fi
          node scripts/promote-live-snapshot.mjs "$RUNNER_TEMP/live-snapshot.json"
          npm run check

      - name: Save private training and model data
        if: steps.snapshot.outputs.available == 'true'
        run: bash scripts/private-data-sync.sh save-refresh

      - name: Guard public model payloads
        if: steps.snapshot.outputs.available == 'true'
        run: node scripts/guard-public-model.mjs

      - name: Commit verified Tier 1/2 data
        if: steps.snapshot.outputs.available == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/predictions.json docs/data/predictions.js docs/data/coverage.json docs/data/coverage.js docs/data/players.json docs/data/players.js docs/data/history.json docs/data/live-snapshot.json docs/data/model-registry.json
          git diff --cached --quiet || git commit -m "Refresh verified CS2 results and projections"
          git push

