name: Validate predictor release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate product build and snapshot contract
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install model and worker test dependencies
        run: python -m pip install --disable-pip-version-check numpy -r infra/oracle/worker/requirements.txt

      - name: Test live promotion
        run: python -m unittest work.cs2_predictor.test_live_promotion

      - name: Test Oracle source adapters
        working-directory: infra/oracle/worker
        run: python -m unittest test_server.py
