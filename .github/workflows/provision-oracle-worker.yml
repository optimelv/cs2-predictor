name: Provision Oracle Always Free worker

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

concurrency:
  group: provision-oracle-always-free
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install OCI SDK
        run: python -m pip install --disable-pip-version-check oci==2.182.1

      - name: Materialize OCI signing key
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          if [ -z "$OCI_PRIVATE_KEY" ]; then
            echo "OCI_PRIVATE_KEY is missing." >&2
            exit 1
          fi
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$RUNNER_TEMP/oci_api_key.pem"
          chmod 600 "$RUNNER_TEMP/oci_api_key.pem"

      - name: Provision only Always Free resources
        id: provision
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_REGION: eu-frankfurt-1
          OCI_KEY_FILE: ${{ runner.temp }}/oci_api_key.pem
          SSH_PUBLIC_KEY_FILE: infra/oracle/strikesignal_oracle_rsa.pub
          CLOUD_INIT_FILE: infra/oracle/cloud-init.sh
          SUPPRESS_LABEL_WARNING: "True"
        run: python infra/oracle/provision.py

      - name: Record worker endpoint
        if: steps.provision.outputs.worker_url != ''
        env:
          WORKER_URL: ${{ steps.provision.outputs.worker_url }}
        run: python infra/oracle/write_worker_config.py --url "$WORKER_URL"

      - name: Publish endpoint for Vercel deployment
        if: steps.provision.outputs.worker_url != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/oracle-worker.js
          git diff --cached --quiet || git commit -m "Connect Oracle live worker"
          git push
